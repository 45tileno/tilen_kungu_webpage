<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1f2937;
    }
    .card {
        width: min(92vw, 420px);
        background: white;
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
    }
    h2 { margin-top: 0; color: #4338ca; }
    p { color: #64748b; margin-bottom: 16px; }
    input {
        width: 100%;
        padding: 12px 14px;
        margin: 8px 0 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(90deg, #4f46e5, #6366f1);
        color: white;
        border: none;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
    }
    .toggle {
        text-align: center;
        margin-top: 14px;
        cursor: pointer;
        color: #4338ca;
        font-weight: 600;
    }
    .small { font-size: 0.9rem; color: #64748b; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
    <div id="loginForm">
        <h2>Welcome back</h2>
        <p>Sign in to access your account.</p>
        <form id="loginFormElement">
            <input type="text" id="loginUsername" placeholder="Username or Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="loginMessage" class="small"></div>
        <div class="toggle" onclick="showRegister()">Don’t have an account? Register</div>
    </div>

    <div id="registerForm" style="display:none;">
        <h2>Create account</h2>
        <p>Join and start managing your projects with ease.</p>
        <form id="registerFormElement">
            <input type="text" id="registerUsername" placeholder="Username" required>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <div id="registerMessage" class="small"></div>
        <div class="toggle" onclick="showLogin()">Already have an account? Login</div>
    </div>
    <p class="small">Your login/register now uses the Node backend.</p>
</div>

<script>
function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
}
function showLogin() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
}

const apiBase = 'http://localhost:3000';

document.getElementById('registerFormElement').addEventListener('submit', async function (event) {
    event.preventDefault();
    const username = document.getElementById('registerUsername').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;
    const registerMessage = document.getElementById('registerMessage');

    registerMessage.textContent = '';

    const response = await fetch(`${apiBase}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password }),
    });

    let result;
    try {
        result = await response.json();
    } catch {
        registerMessage.textContent = 'Server error: unable to register right now.';
        registerMessage.style.color = '#dc2626';
        return;
    }

    registerMessage.textContent = result.message;
    registerMessage.style.color = result.success ? '#16a34a' : '#dc2626';

    if (result.success) {
        document.getElementById('registerFormElement').reset();
        showLogin();
    }
});

document.getElementById('loginFormElement').addEventListener('submit', async function (event) {
    event.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const loginMessage = document.getElementById('loginMessage');

    loginMessage.textContent = '';

    const response = await fetch(`${apiBase}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
    });

    let result;
    try {
        result = await response.json();
    } catch {
        loginMessage.textContent = 'Server error: unable to log in right now.';
        loginMessage.style.color = '#dc2626';
        return;
    }

    loginMessage.textContent = result.message;
    loginMessage.style.color = result.success ? '#16a34a' : '#dc2626';

    if (result.success) {
        localStorage.setItem('mywebpageSessionId', result.sessionId);
        document.getElementById('loginFormElement').reset();
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 800);
    }
});
</script>
</body>
</html>
