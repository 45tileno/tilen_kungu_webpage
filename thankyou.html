<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
        }
        .card {
            text-align: center;
            max-width: 480px;
            width: 90%;
            background: white;
            padding: 34px;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }
        h1 { margin-top: 0; color: #4338ca; }
        p { color: #475569; line-height: 1.75; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thank you!</h1>
        <p>Your message has been sent successfully. I will follow up as soon as possible.</p>
        <a href="index.html">Return to the website</a>
    </div>
</body>
</html>
